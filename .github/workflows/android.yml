name: Android CI

on:
  push:
    branches:
      - main
      - 'workbench/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 解码固定签名keystore
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > app/release-keystore.jks
          ls -la app/release-keystore.jks

      - name: Run diagnostic compile
        id: diagnostic
        run: bash tools/ci-diagnose.sh
      - name: Build signed debug APK
        if: steps.diagnostic.outcome == 'success'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Build signed release APK
        if: steps.diagnostic.outcome == 'success'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Run unit tests
        if: steps.diagnostic.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      # 上传签名APK
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uma-workbench-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 90
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: uma-workbench-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics-${{ github.run_id }}
          path: |
            build/ci-diagnostics
            app/build/reports
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14
