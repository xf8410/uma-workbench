name: Android CI

on:
  push:
    branches:
      - main
      - 'workbench/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > app/release-keystore.jks
          ls -la app/release-keystore.jks
      - name: Run diagnostic compile
        id: diagnostic
        run: bash tools/ci-diagnose.sh
      - name: Publish compile log
        if: failure()
        shell: bash
        run: |
          {
            printf '## compileDebugKotlin.log\n\n```text\n'
            cat build/ci-diagnostics/compileDebugKotlin.log
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build signed debug APK
        if: steps.diagnostic.outcome == 'success'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Build signed release APK
        if: steps.diagnostic.outcome == 'success'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Run unit tests with complete diagnostics
        if: steps.diagnostic.outcome == 'success'
        shell: bash
        run: |
          mkdir -p build/ci-diagnostics
          set +e
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build/ci-diagnostics/testDebugUnitTest.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              printf '## testDebugUnitTest.log\n\n```text\n'
              cat build/ci-diagnostics/testDebugUnitTest.log
              printf '\n```\n\n## Complete JUnit XML\n'
              while IFS= read -r -d '' report; do
                printf '\n### `%s`\n\n```xml\n' "$report"
                cat "$report"
                printf '\n```\n'
              done < <(find app/build/test-results -type f -name '*.xml' -print0 2>/dev/null | sort -z)
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              escaped=${escaped//$'\n'/'%0A'}
              printf '::error title=Unit test diagnostic::%s\n' "$escaped"
            done < <(grep -E '(^|[[:space:]])(FAILED|FAILURE:|Caused by:|AssertionError|expected:)' build/ci-diagnostics/testDebugUnitTest.log || true)
          fi
          exit "$status"
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uma-workbench-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 90
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: uma-workbench-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 90
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics-${{ github.run_id }}
          path: |
            build/ci-diagnostics
            app/build/reports
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14
