name: Android CI

on:
  push:
    branches:
      - main
      - 'workbench/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > app/release-keystore.jks
          ls -la app/release-keystore.jks
      - name: Run diagnostic compile
        id: diagnostic
        run: bash tools/ci-diagnose.sh
      - name: Describe compile failure
        id: compile_failure
        if: failure()
        shell: bash
        run: |
          first_error="$(grep -m1 -E '(^e: |^error: |Compilation error)' build/ci-diagnostics/compileDebugKotlin.log || true)"
          if [[ -z "$first_error" ]]; then
            first_error="compile-failed-see-diagnostic-log"
          fi
          safe="$(printf '%s' "$first_error" | tr '\n/:\\ ' '-' | tr -cd '[:alnum:]_.-[:space:]' | cut -c1-160)"
          echo "artifact_suffix=$safe" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$first_error" >> "$GITHUB_STEP_SUMMARY"
      - name: Build signed debug APK
        if: steps.diagnostic.outcome == 'success'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Build signed release APK
        if: steps.diagnostic.outcome == 'success'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Run unit tests
        if: steps.diagnostic.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uma-workbench-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 90
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: uma-workbench-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 90
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics-${{ github.run_id }}-${{ steps.compile_failure.outputs.artifact_suffix }}
          path: |
            build/ci-diagnostics
            app/build/reports
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14
