name: Android CI

on:
  push:
    branches:
      - main
      - 'workbench/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run diagnostic compile
        id: diagnostic
        run: bash tools/ci-diagnose.sh
      - name: Build debug APK
        if: steps.diagnostic.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run unit tests
        if: steps.diagnostic.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics-${{ github.run_id }}
          path: |
            build/ci-diagnostics
            app/build/reports
            app/build/test-results
          if-no-files-found: warn
          retention-days: 14
